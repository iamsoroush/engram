services:
  postgres:
    # pgvector/pgvector:pg16 = stock Postgres 16 + the `vector` extension the Q&A knowledge retrieval
    # needs (decision-complete: pgvector in the existing Postgres, no new infra). Debian-based, so it
    # replaces the former alpine image — see docs/production-alpha-tradeoffs.md for the one-time
    # REINDEX note when swapping on an existing data volume (glibc vs musl collation).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engram}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-engram-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-engram-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8010}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:5183"]}
      BACKEND_CAPTURE_ROOT: /data/captures
      BACKEND_AUTH_MODE: ${BACKEND_AUTH_MODE:-dev}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-dev-only-change-me}
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+psycopg://engram:engram@postgres:5432/engram}
      BACKEND_OBJECT_STORAGE_ENDPOINT: ${BACKEND_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      BACKEND_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${BACKEND_OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9010}
      BACKEND_OBJECT_STORAGE_BUCKET: ${BACKEND_OBJECT_STORAGE_BUCKET:-engram-captures}
      BACKEND_OBJECT_STORAGE_ACCESS_KEY: ${BACKEND_OBJECT_STORAGE_ACCESS_KEY:-engram-dev}
      BACKEND_OBJECT_STORAGE_SECRET_KEY: ${BACKEND_OBJECT_STORAGE_SECRET_KEY:-engram-dev-secret}
      BACKEND_OBJECT_STORAGE_SECURE: ${BACKEND_OBJECT_STORAGE_SECURE:-false}
      BACKEND_OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: ${BACKEND_OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:-300}
      BACKEND_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKEND_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      BACKEND_AI_JOB_MAX_RETRIES: ${BACKEND_AI_JOB_MAX_RETRIES:-3}
      BACKEND_AI_JOB_RETRY_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_DELAY_SECONDS:-30}
      BACKEND_AI_JOB_RETRY_MAX_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_MAX_DELAY_SECONDS:-900}
      BACKEND_AI_JOB_DISPATCH_VISIBILITY_TIMEOUT_SECONDS: ${BACKEND_AI_JOB_DISPATCH_VISIBILITY_TIMEOUT_SECONDS:-300}
      BACKEND_AI_JOB_RUNNING_STALE_SECONDS: ${BACKEND_AI_JOB_RUNNING_STALE_SECONDS:-900}
      BACKEND_AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:-dev-ai-engine-token}
      # Q&A knowledge retrieval — optional embeddings gateway (AES-1802). Blank base_url => embeddings
      # OFF and retrieval is lexical-only (deterministic; CI/e2e stay gateway-less). Point base_url at
      # our gateway's OpenAI-compatible /embeddings and reuse the same gateway key to turn semantic
      # matching on; a startup pass then backfills any lexical-only rows.
      BACKEND_EMBEDDINGS_BASE_URL: ${BACKEND_EMBEDDINGS_BASE_URL:-}
      BACKEND_EMBEDDINGS_API_KEY: ${BACKEND_EMBEDDINGS_API_KEY:-${AI_ENGINE_TRANSCRIPTION_API_KEY:-unused}}
      BACKEND_EMBEDDINGS_MODEL: ${BACKEND_EMBEDDINGS_MODEL:-text-embedding-3-small}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./apps/backend:/app
      - ./captures:/data/captures
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ai-engine:
    build:
      context: ./apps
      dockerfile: ai_engine/Dockerfile
    environment:
      AI_ENGINE_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      AI_ENGINE_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AI_ENGINE_BACKEND_INTERNAL_URL: ${AI_ENGINE_BACKEND_INTERNAL_URL:-http://backend:8000}
      AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:-dev-ai-engine-token}
      AI_ENGINE_JOB_MAX_RETRIES: ${BACKEND_AI_JOB_MAX_RETRIES:-3}
      AI_ENGINE_JOB_RETRY_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_DELAY_SECONDS:-30}
      AI_ENGINE_RECOVERY_INTERVAL_SECONDS: ${AI_ENGINE_RECOVERY_INTERVAL_SECONDS:-60}
      AI_ENGINE_TRANSCRIPTION_BASE_URL: ${AI_ENGINE_TRANSCRIPTION_BASE_URL:-}
      AI_ENGINE_TRANSCRIPTION_API_KEY: ${AI_ENGINE_TRANSCRIPTION_API_KEY:-unused}
      AI_ENGINE_TRANSCRIPTION_MODEL: ${AI_ENGINE_TRANSCRIPTION_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - ./apps/ai_engine:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A ai_engine.celery_app.celery_app worker --loglevel=INFO --queues=ai_jobs --beat --schedule=/tmp/engram-celerybeat-schedule

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${FRONTEND_PORT:-5183}:5183"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5183

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
  redis_data:
