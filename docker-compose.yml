services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aesmem}
      POSTGRES_USER: ${POSTGRES_USER:-aesmem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aesmem}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aesmem-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aesmem-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_CAPTURE_ROOT: /data/captures
      BACKEND_AUTH_MODE: ${BACKEND_AUTH_MODE:-dev}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-dev-only-change-me}
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+psycopg://aesmem:aesmem@postgres:5432/aesmem}
      BACKEND_OBJECT_STORAGE_ENDPOINT: ${BACKEND_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      BACKEND_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${BACKEND_OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      BACKEND_OBJECT_STORAGE_BUCKET: ${BACKEND_OBJECT_STORAGE_BUCKET:-aesmem-captures}
      BACKEND_OBJECT_STORAGE_ACCESS_KEY: ${BACKEND_OBJECT_STORAGE_ACCESS_KEY:-aesmem-dev}
      BACKEND_OBJECT_STORAGE_SECRET_KEY: ${BACKEND_OBJECT_STORAGE_SECRET_KEY:-aesmem-dev-secret}
      BACKEND_OBJECT_STORAGE_SECURE: ${BACKEND_OBJECT_STORAGE_SECURE:-false}
      BACKEND_OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: ${BACKEND_OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:-300}
      BACKEND_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKEND_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      BACKEND_AI_JOB_MAX_RETRIES: ${BACKEND_AI_JOB_MAX_RETRIES:-3}
      BACKEND_AI_JOB_RETRY_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_DELAY_SECONDS:-30}
      BACKEND_AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:-dev-ai-engine-token}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/backend:/app
      - ./captures:/data/captures
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ai-engine:
    build:
      context: ./apps
      dockerfile: ai_engine/Dockerfile
    environment:
      AI_ENGINE_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      AI_ENGINE_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AI_ENGINE_BACKEND_INTERNAL_URL: ${AI_ENGINE_BACKEND_INTERNAL_URL:-http://backend:8000}
      AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:-dev-ai-engine-token}
      AI_ENGINE_JOB_MAX_RETRIES: ${BACKEND_AI_JOB_MAX_RETRIES:-3}
      AI_ENGINE_JOB_RETRY_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_DELAY_SECONDS:-30}
    volumes:
      - ./apps/ai_engine:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A ai_engine.celery_app.celery_app worker --loglevel=INFO --queues=ai_jobs

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
  redis_data:
