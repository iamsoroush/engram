# Log rotation for every service (default json-file grows unbounded → fills the disk).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Resource limits: set per-service `mem_limit:` / `cpus:` sized to your VPS — see docs/production.md.

services:
  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + the `vector` extension (Q&A knowledge retrieval;
    # decision-complete). This REPLACES postgres:16-alpine. On the FIRST deploy against the existing
    # production data volume, run a one-time `REINDEX DATABASE engram` (Debian glibc vs alpine musl
    # collation) during the maintenance window — see docs/production-alpha-tradeoffs.md.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engram}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      BACKEND_APP_NAME: ${BACKEND_APP_NAME:-Engram API}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost"]}
      BACKEND_CAPTURE_ROOT: /data/captures
      BACKEND_AUTH_MODE: ${BACKEND_AUTH_MODE:-production}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?BACKEND_JWT_SECRET is required}
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required}
      BACKEND_OBJECT_STORAGE_ENDPOINT: ${BACKEND_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      BACKEND_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${BACKEND_OBJECT_STORAGE_PUBLIC_ENDPOINT:-}
      BACKEND_OBJECT_STORAGE_BUCKET: ${BACKEND_OBJECT_STORAGE_BUCKET:-engram-captures}
      BACKEND_OBJECT_STORAGE_ACCESS_KEY: ${BACKEND_OBJECT_STORAGE_ACCESS_KEY:?BACKEND_OBJECT_STORAGE_ACCESS_KEY is required}
      BACKEND_OBJECT_STORAGE_SECRET_KEY: ${BACKEND_OBJECT_STORAGE_SECRET_KEY:?BACKEND_OBJECT_STORAGE_SECRET_KEY is required}
      BACKEND_OBJECT_STORAGE_SECURE: ${BACKEND_OBJECT_STORAGE_SECURE:-false}
      BACKEND_OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: ${BACKEND_OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:-300}
      BACKEND_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKEND_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      BACKEND_AI_JOB_MAX_RETRIES: ${BACKEND_AI_JOB_MAX_RETRIES:-3}
      BACKEND_AI_JOB_RETRY_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_DELAY_SECONDS:-30}
      BACKEND_AI_JOB_RETRY_MAX_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_MAX_DELAY_SECONDS:-900}
      BACKEND_AI_JOB_DISPATCH_VISIBILITY_TIMEOUT_SECONDS: ${BACKEND_AI_JOB_DISPATCH_VISIBILITY_TIMEOUT_SECONDS:-300}
      BACKEND_AI_JOB_RUNNING_STALE_SECONDS: ${BACKEND_AI_JOB_RUNNING_STALE_SECONDS:-900}
      BACKEND_AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:?AI_ENGINE_INTERNAL_TOKEN is required}
      # Pro single-pass report synthesis dispatch (OFF by default; ON where the gateway is reachable).
      BACKEND_REPORT_SYNTHESIS_ENABLED: ${BACKEND_REPORT_SYNTHESIS_ENABLED:-false}
    volumes:
      - capture_data:/data/captures
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ai-engine:
    build:
      context: ./apps
      dockerfile: ai_engine/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      AI_ENGINE_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      AI_ENGINE_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AI_ENGINE_BACKEND_INTERNAL_URL: ${AI_ENGINE_BACKEND_INTERNAL_URL:-http://backend:8000}
      AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:?AI_ENGINE_INTERNAL_TOKEN is required}
      AI_ENGINE_JOB_MAX_RETRIES: ${BACKEND_AI_JOB_MAX_RETRIES:-3}
      AI_ENGINE_JOB_RETRY_DELAY_SECONDS: ${BACKEND_AI_JOB_RETRY_DELAY_SECONDS:-30}
      AI_ENGINE_RECOVERY_INTERVAL_SECONDS: ${AI_ENGINE_RECOVERY_INTERVAL_SECONDS:-60}
      AI_ENGINE_TRANSCRIPTION_BASE_URL: ${AI_ENGINE_TRANSCRIPTION_BASE_URL:-}
      AI_ENGINE_TRANSCRIPTION_API_KEY: ${AI_ENGINE_TRANSCRIPTION_API_KEY:-unused}
      AI_ENGINE_TRANSCRIPTION_MODEL: ${AI_ENGINE_TRANSCRIPTION_MODEL:-gemini-3.1-flash-lite}
      # Per-task model overrides on the same gateway (blank => fall back to the transcription model/url/key).
      AI_ENGINE_REPORT_SYNTHESIS_MODEL: ${AI_ENGINE_REPORT_SYNTHESIS_MODEL:-}
      AI_ENGINE_REPORT_SYNTHESIS_REASONING_EFFORT: ${AI_ENGINE_REPORT_SYNTHESIS_REASONING_EFFORT:-low}
      AI_ENGINE_CAPTION_MODEL: ${AI_ENGINE_CAPTION_MODEL:-}
      AI_ENGINE_PATIENT_MEMORY_MODEL: ${AI_ENGINE_PATIENT_MEMORY_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    command: celery -A ai_engine.celery_app.celery_app worker --loglevel=INFO --queues=ai_jobs --beat --schedule=/tmp/engram-celerybeat-schedule

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PROD_VITE_API_URL:-}
    ports:
      - "${PROD_FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]  # uses localhost because nginx proxies to backend
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  capture_data:
  postgres_data:
  minio_data:
  redis_data:
