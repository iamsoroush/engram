name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: apps/backend
        run: python -m unittest discover -s tests

  ai-engine:
    name: AI engine tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai_engine/requirements.txt

      - name: Install dependencies
        working-directory: apps/ai_engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: apps/ai_engine
        run: python -m unittest discover -s tests

  frontend:
    name: Frontend checks (typecheck + unit + i18n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Typecheck
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: apps/frontend
        run: npm run test:unit

      - name: i18n guard (no hardcoded chrome strings)
        working-directory: apps/frontend
        run: npm run i18n:guard

  doc-links:
    name: Doc links (resolve + docs/work isolation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails on dangling relative markdown links and on system-state docs
      # linking into docs/work/ (the temporary process-doc workspace).
      # See CLAUDE.md §3 "Close the loop".
      - name: Check markdown links
        run: python3 scripts/check-doc-links.py

  compose-validate:
    name: Validate prod compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validate docker-compose.prod.yml parses. The prod compose uses
      # ${VAR:?required} guards, so supply dummy values for the required vars
      # inline. This only catches compose syntax/interpolation breakage; no
      # images are built and no services are started.
      - name: docker compose config
        env:
          BACKEND_DATABASE_URL: postgresql+psycopg://user:pass@postgres:5432/db
          BACKEND_JWT_SECRET: dummy-jwt-secret
          BACKEND_OBJECT_STORAGE_ACCESS_KEY: dummy-access-key
          BACKEND_OBJECT_STORAGE_SECRET_KEY: dummy-secret-key
          AI_ENGINE_INTERNAL_TOKEN: dummy-ai-engine-token
          MINIO_ROOT_USER: dummy-minio-user
          MINIO_ROOT_PASSWORD: dummy-minio-password
          POSTGRES_PASSWORD: dummy-postgres-password
        run: docker compose -f docker-compose.prod.yml config -q

  e2e:
    name: Frontend e2e (Playwright, mocked API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright's Chrome
        working-directory: apps/frontend
        run: npx playwright install --with-deps chrome

      # playwright.config.ts auto-starts the Vite dev server and the specs mock the API, so no
      # backend/services are needed. NOTE: tests/visual are snapshot-based — if they prove
      # env-sensitive in CI, split them into their own (non-blocking) job or manage baselines.
      - name: Run e2e
        working-directory: apps/frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  e2e-stack:
    name: E2E stack (Playwright, real backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright's Chrome
        working-directory: apps/frontend
        run: npx playwright install --with-deps chrome

      # Bring up the REAL compose stack, gateway-less + deterministic (docker-compose.e2e.yml), and
      # block until backend + frontend are healthy. This exercises the API contract, Alembic
      # migrations, MinIO upload, the Celery pipeline, real tier gating, and the public token pages.
      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait

      - name: Run e2e-stack (P0)
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5183
        run: npx playwright test --config playwright.stack.config.ts p0-

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: apps/frontend/playwright-report-stack
          retention-days: 7

      - name: Dump backend + ai-engine logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color backend ai-engine

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  e2e-stack-ai:
    name: E2E stack + mock AI (Playwright, P1)
    # Main-merge only (slower; adds the mock LLM gateway + synthesis). PRs run the P0 gate above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright's Chrome
        working-directory: apps/frontend
        run: npx playwright install --with-deps chrome

      # Same real stack, plus the deterministic mock LLM gateway + synthesis enabled.
      - name: Start stack (+ mock gateway)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-ai.yml up -d --build --wait

      - name: Run e2e-stack-ai (P1)
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5183
        run: npx playwright test --config playwright.stack.config.ts p1-

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack-ai
          path: apps/frontend/playwright-report-stack
          retention-days: 7

      - name: Dump backend + ai-engine + mock-gateway logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-ai.yml logs --no-color backend ai-engine mock-gateway

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-ai.yml down -v
