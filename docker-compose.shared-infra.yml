# Shared development infrastructure for isolated per-worktree app stacks.
#
# One Postgres + one MinIO, shared by the main checkout AND every worktree stack.
# Each stack gets its own DATABASE (cloned from the canonical `engram` DB) and its
# own BUCKET (mirrored from `engram-captures`), so data is isolated but easy to seed.
#
# Lifecycle is managed by scripts/dev-stack.sh — you normally do not run this file
# by hand. To bring it up directly:
#   docker compose -p engram-infra -f docker-compose.shared-infra.yml up -d
#
# The app services (backend / ai-engine / frontend / redis) live in
# docker-compose.app.yml and attach to the `engram-shared` network defined here.

networks:
  default:
    name: engram-shared

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engram}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-engram-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-engram-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - shared_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shared_postgres_data:
  shared_minio_data:
