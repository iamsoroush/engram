global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: notari-prod

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    # Optional. Run an Alertmanager (or use Grafana alerting) and point this at it.
    # Left empty by default so Prometheus starts without a hard dependency.
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics: CPU / mem / disk / load / filesystem (host disk = backup/object-store/Postgres disk)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics: CPU/mem per container, restarts, container up/down
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Postgres: connections, transactions, locks, DB size, replication
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis: memory, clients, keyspace, AND Celery queue depth via check-keys (see redis-exporter command)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # FastAPI application metrics (API error rate, p95 latency, failed uploads, AI-job failures).
  # REQUIRES the backend to expose Prometheus metrics at /metrics (see docs/monitoring.md
  # "Application metrics"). Until then this target is DOWN — that is expected, not an outage.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Uptime Kuma can export its monitor results to Prometheus. Optional; enable a metrics
  # API key in Uptime Kuma settings, then this surfaces cert-expiry + up/down in Grafana.
  - job_name: uptime-kuma
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["uptime-kuma:3001"]
